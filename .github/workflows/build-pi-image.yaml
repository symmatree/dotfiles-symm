name: "build-pi-image"

# Convert the official Raspberry Pi OS Lite (Trixie, arm64) image into the
# fleet btrfs-subvolume layout (per-role, via the matrix below) and publish each
# flashable .img as an artifact. MUST run on an arm64 runner: the build loop-mounts + mkfs.btrfs
# (needs a btrfs-capable kernel) and chroots the arm64 rootfs natively to
# regenerate the initramfs. Neither is possible on the x86 notebook host.
on:
  workflow_dispatch: {}
  push:
    paths:
      - "pi-image/**"
      # provision/ is the Windows-side flashing tooling. It cannot affect the
      # built image, so changes there must not trigger three arm64 image builds.
      - "!pi-image/provision/**"
      - ".github/workflows/build-pi-image.yaml"

permissions:
  contents: "read"

jobs:
  build:
    runs-on: "ubuntu-24.04-arm"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: ["coordinator", "campod", "pocketterm"]
    steps:
      - uses: "actions/checkout@v6"

      - name: "Install build deps"
        shell: "bash"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            btrfs-progs dosfstools xz-utils parted util-linux rsync unzip cpio

      - name: "Build image"
        shell: "bash"
        run: |
          set -euo pipefail
          sudo pi-image/build-image.sh "${{ matrix.role }}"

      - name: "Take ownership of the build output"
        shell: "bash"
        run: |
          set -euo pipefail
          # build-image.sh runs as root, so .build is root-owned; take it back so
          # the artifact upload can read it.
          sudo chown -R "$(id -u):$(id -g)" pi-image/.build
          ls -lh pi-image/.build/${{ matrix.role }}-pi-*.img

      # The RAW .img is uploaded, not a compressed one. Actions artifacts are
      # always served as a zip -- the download URL is literally .../artifacts/N/zip
      # -- so compressing here just nests an archive inside an archive and forces
      # an unwrap before the image can be flashed. Handing the zip a raw .img
      # instead makes the downloaded file directly flashable: rpi-imager reads
      # .zip natively, so it is pointed at the download with no unwrap step.
      #
      # The zip's deflate is a worse compressor than xz (~0.18 vs ~0.14 on a Pi
      # image), which costs download size and nothing else, and removes a
      # compression step that was about two thirds of the build.
      - name: "Upload image artifact"
        uses: "actions/upload-artifact@v4"
        with:
          name: "${{ matrix.role }}-pi-btrfs-img"
          path: "pi-image/.build/${{ matrix.role }}-pi-*.img"
          if-no-files-found: "error"
          include-hidden-files: true
          retention-days: 14
