name: "build-pi-image"

# Convert the official Raspberry Pi OS Lite (Bookworm, arm64) image into the
# fleet btrfs-subvolume layout (per-role, via the matrix below) and publish each
# flashable .img as an artifact. MUST run on an arm64 runner: the build loop-mounts + mkfs.btrfs
# (needs a btrfs-capable kernel) and chroots the arm64 rootfs natively to
# regenerate the initramfs. Neither is possible on the x86 notebook host.
on:
  workflow_dispatch: {}
  push:
    paths:
      - "pi-image/**"
      - ".github/workflows/build-pi-image.yaml"

permissions:
  contents: "read"

jobs:
  build:
    runs-on: "ubuntu-24.04-arm"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: ["coordinator", "campod", "pocketterm"]
    steps:
      - uses: "actions/checkout@v6"

      - name: "Install build deps"
        shell: "bash"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            btrfs-progs dosfstools xz-utils parted util-linux rsync unzip \
            qemu-system-arm qemu-utils

      - name: "Build image"
        shell: "bash"
        run: |
          set -euo pipefail
          sudo pi-image/build-image.sh "${{ matrix.role }}"

      - name: "Boot smoke-test (btrfs-subvol root mounts + pivots)"
        id: "boottest"
        shell: "bash"
        # Non-fatal in v1: a clean PASS is strong signal, a non-PASS is reported
        # but does not fail the build (the RPi kernel may not come up on -M virt).
        # Flip to STRICT=1 once the boot path is proven to gate future regressions.
        run: |
          set -euo pipefail
          shopt -s nullglob
          imgs=(pi-image/.build/${{ matrix.role }}-pi-*.img)
          sudo pi-image/boot-test.sh "${imgs[0]}" || true

      - name: "Compress image"
        shell: "bash"
        run: |
          set -euo pipefail
          # build-image.sh runs as root, so .build is root-owned; take it back so
          # this (non-sudo) step and the artifact upload can read/write it.
          sudo chown -R "$(id -u):$(id -g)" pi-image/.build
          shopt -s nullglob
          imgs=(pi-image/.build/${{ matrix.role }}-pi-*.img)
          xz -T0 -6 "${imgs[0]}"
          ls -lh pi-image/.build/${{ matrix.role }}-pi-*.img.xz

      - name: "Upload image artifact"
        uses: "actions/upload-artifact@v4"
        with:
          name: "${{ matrix.role }}-pi-btrfs-img"
          path: "pi-image/.build/${{ matrix.role }}-pi-*.img.xz"
          if-no-files-found: "error"
          include-hidden-files: true
          retention-days: 14

      - name: "Upload boot-test serial log"
        if: "success() || failure()"
        uses: "actions/upload-artifact@v4"
        with:
          name: "boot-serial-log-${{ matrix.role }}"
          path: "pi-image/.build/boot-serial.log"
          if-no-files-found: "ignore"
          include-hidden-files: true
          retention-days: 14
