name: "build-pi-image"

# Convert the official Raspberry Pi OS Lite (Bookworm, arm64) image into the
# fleet btrfs-subvolume layout (per-role, via the matrix below) and publish each
# flashable .img as an artifact. MUST run on an arm64 runner: the build loop-mounts + mkfs.btrfs
# (needs a btrfs-capable kernel) and chroots the arm64 rootfs natively to
# regenerate the initramfs. Neither is possible on the x86 notebook host.
on:
  workflow_dispatch: {}
  push:
    paths:
      - "pi-image/**"
      # provision/ is the Windows-side flashing tooling. It cannot affect the
      # built image, so changes there must not trigger three arm64 image builds.
      - "!pi-image/provision/**"
      - ".github/workflows/build-pi-image.yaml"

permissions:
  contents: "read"

jobs:
  build:
    runs-on: "ubuntu-24.04-arm"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: ["coordinator", "campod", "pocketterm"]
    steps:
      - uses: "actions/checkout@v6"

      - name: "Install build deps"
        shell: "bash"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            btrfs-progs dosfstools xz-utils parted util-linux rsync unzip

      - name: "Build image"
        shell: "bash"
        run: |
          set -euo pipefail
          sudo pi-image/build-image.sh "${{ matrix.role }}"

      - name: "Compress image"
        shell: "bash"
        run: |
          set -euo pipefail
          # build-image.sh runs as root, so .build is root-owned; take it back so
          # this (non-sudo) step and the artifact upload can read/write it.
          sudo chown -R "$(id -u):$(id -g)" pi-image/.build
          shopt -s nullglob
          imgs=(pi-image/.build/${{ matrix.role }}-pi-*.img)
          xz -T0 -6 "${imgs[0]}"
          ls -lh pi-image/.build/${{ matrix.role }}-pi-*.img.xz

      - name: "Upload image artifact"
        uses: "actions/upload-artifact@v4"
        with:
          name: "${{ matrix.role }}-pi-btrfs-img"
          path: "pi-image/.build/${{ matrix.role }}-pi-*.img.xz"
          if-no-files-found: "error"
          include-hidden-files: true
          retention-days: 14
