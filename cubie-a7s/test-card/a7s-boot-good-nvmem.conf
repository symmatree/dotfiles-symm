# /etc/systemd/system/a7s-boot-good.service.d/10-nvmem.conf on the Debian test card.
# The Talos kernel has no /dev/mem. The RTC driver exposes the GP_DATA
# registers as nvmem (32 bytes, REG7 at offset 28); clear REG7 there.
[Service]
ExecStart=
ExecStart=/bin/sh -c "/usr/bin/busybox devmem 0x0709011C 32 0 || dd if=/dev/zero of=/sys/devices/platform/soc/7090000.rtc/nvmem0/nvmem bs=4 seek=7 count=1 conv=notrunc status=none"
